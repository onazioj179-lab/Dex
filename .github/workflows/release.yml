name: Release candidate

on:
  push:
    tags: ['v*.*.*']
  workflow_dispatch:
    inputs:
      tag:
        description: 'Existing version tag to package (for example v7.0.1)'
        required: true
        type: string

# This workflow only builds reviewable artifacts. It does not publish releases.
permissions:
  contents: read

jobs:
  windows:
    runs-on: windows-latest
    env:
      RELEASE_TAG: ${{ github.event.inputs.tag || github.ref_name }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.inputs.tag || github.ref }}
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
      - name: Validate release identity
        shell: pwsh
        run: |
          if ($env:RELEASE_TAG -notmatch '^v[0-9]+\.[0-9]+\.[0-9]+$') { throw 'Invalid release tag' }
          $packageVersion = (Get-Content package.json -Raw | ConvertFrom-Json).version
          $tauriVersion = (Get-Content src-tauri/tauri.conf.json -Raw | ConvertFrom-Json).version
          if ($env:RELEASE_TAG -ne "v$packageVersion" -or $packageVersion -ne $tauriVersion) { throw 'Release version mismatch' }
      - run: npm ci --ignore-scripts
      - run: npm run lint
      - run: npx vitest run --maxWorkers=2
      - run: cargo test --locked --manifest-path src-tauri/Cargo.toml
      - name: Build Windows installer
        run: npm run build:tauri -- --bundles nsis
      - name: Upload release candidate
        uses: actions/upload-artifact@v4
        with:
          name: dex-windows-candidate
          path: src-tauri/target/release/bundle/nsis/*.exe
          if-no-files-found: error
