name: Release

on:
  workflow_dispatch:
    inputs:
      tag:
        description: 'Owner-approved stable tag to publish (for example, v7.0.2)'
        required: true

# Read-only by default; only the publishing job can write releases.
permissions:
  contents: read

concurrency:
  group: dex-stable-release

jobs:
  # Quality gate: nothing is built or published unless the tagged commit passes
  # type-check, lint, the IPC ABI guard, version consistency, unit tests and
  # the Rust core tests.
  verify:
    name: Verify release candidate
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ github.event.inputs.tag }}

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@39008827e6b4319a349e9a42dfc90579dd25f1ca # stable

      - name: Cache cargo build
        uses: swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2
        with:
          workspaces: core

      - name: Install dependencies
        run: npm ci --ignore-scripts --no-audit --no-fund

      - name: Version matches the tag
        run: node scripts/check-version.mjs ${{ github.event.inputs.tag }}

      - name: Type-check, watermark and IPC ABI
        run: npm run lint

      - name: Unit tests
        run: npm test

      - name: Rust core tests
        working-directory: core
        run: cargo test --workspace --locked

  release:
    name: Build & publish (Windows / Tauri)
    needs: verify
    runs-on: windows-latest
    permissions:
      contents: write
    # Lift the optional dex-updates token to job env so it can be referenced in a
    # step-level `if:` — GitHub does NOT allow the `secrets` context in `if:`
    # conditions (it fails the whole workflow at startup). `env` IS allowed.
    env:
      DEX_UPDATES_TOKEN: ${{ secrets.DEX_UPDATES_TOKEN }}
      # Build identity: a version tag is the stable channel (About shows it).
      DEX_CHANNEL: stable
      # Optional code signing (docs/SIGNING.md, Option C). Both unset = the
      # setup is built unsigned, exactly as before.
      WINDOWS_CERTIFICATE: ${{ secrets.WINDOWS_CERTIFICATE }}
      WINDOWS_CERTIFICATE_PASSWORD: ${{ secrets.WINDOWS_CERTIFICATE_PASSWORD }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          # Full history: the build number is the commit count (scripts/build-info.mjs).
          fetch-depth: 0
          ref: ${{ github.event.inputs.tag || github.ref }}

      - name: Resolve tag
        id: tag
        env:
          DEX_REQUESTED_TAG: ${{ github.event.inputs.tag }}
        shell: bash
        run: |
          TAG="${DEX_REQUESTED_TAG:-${GITHUB_REF#refs/tags/}}"
          if [[ ! "$TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "::error::Expected a stable vX.Y.Z release tag."
            exit 1
          fi
          node -e 'if ("v" + require("./package.json").version !== process.argv[1]) process.exit(1)' "$TAG"
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '20'
          cache: 'npm'

      # windows-latest ships a stable MSVC Rust toolchain; pin it explicitly so
      # the build is reproducible if the runner image drifts. No rust-toolchain
      # file / .cargo config in the repo forces GNU, so MSVC (Tauri's default,
      # recommended path) is used.
      - name: Setup Rust
        uses: dtolnay/rust-toolchain@39008827e6b4319a349e9a42dfc90579dd25f1ca # stable

      - name: Cache cargo build
        uses: swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2
        with:
          workspaces: src-tauri

      - name: Install dependencies
        run: npm ci --no-audit --no-fund

      # WE DO NOT BREAK USERSPACE: no release may drop a native IPC channel a
      # previous build shipped, or ship renderer calls nothing answers.
      # See docs/NATIVE_ABI.md.
      - name: Native IPC ABI check
        run: npm run abi:check

      # Builds the Vite renderer (via tauri's beforeBuildCommand) then compiles
      # the Rust backbone and bundles the one official Windows setup (NSIS;
      # bundle.targets in src-tauri/tauri.conf.json). Tauri fetches NSIS.
      # When the WINDOWS_CERTIFICATE secret (base64 .pfx) is set, import it and
      # hand its thumbprint to Tauri through TAURI_CONFIG, so the thumbprint is
      # never committed. Tauri then signs dex-tauri.exe and the setup with
      # bundle.windows.digestAlgorithm/timestampUrl from tauri.conf.json.
      - name: Import code-signing certificate
        if: ${{ env.WINDOWS_CERTIFICATE != '' }}
        shell: pwsh
        run: |
          $pfx = Join-Path $env:RUNNER_TEMP 'dex-signing.pfx'
          [IO.File]::WriteAllBytes($pfx, [Convert]::FromBase64String($env:WINDOWS_CERTIFICATE))
          $pw = ConvertTo-SecureString -String $env:WINDOWS_CERTIFICATE_PASSWORD -Force -AsPlainText
          $cert = Import-PfxCertificate -FilePath $pfx -CertStoreLocation Cert:\CurrentUser\My -Password $pw
          Remove-Item $pfx -Force
          if (-not $cert.HasPrivateKey) { Write-Error 'The certificate has no private key.'; exit 1 }
          "DEX_CERT_THUMBPRINT=$($cert.Thumbprint)" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8
          "DEX_EXPECT_SIGNED=1" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8
          Write-Host "Signing with $($cert.Subject), expires $($cert.NotAfter)"

      - name: Build Tauri setup (NSIS)
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        shell: pwsh
        run: |
          if (-not $env:TAURI_SIGNING_PRIVATE_KEY) { throw 'Missing the DEX updater signing key.' }
          $bundle = @{ createUpdaterArtifacts = $true }
          if ($env:DEX_CERT_THUMBPRINT) {
            $bundle.windows = @{ certificateThumbprint = $env:DEX_CERT_THUMBPRINT }
          }
          $config = Join-Path $env:RUNNER_TEMP 'dex-release-config.json'
          @{ bundle = $bundle } | ConvertTo-Json -Depth 5 | Set-Content -LiteralPath $config -Encoding utf8
          npx tauri build --config $config
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          npm run verify:bundle

      - name: Check installer signature
        shell: pwsh
        run: |
          $setup = Get-ChildItem src-tauri/target/release/bundle/nsis/*-setup.exe | Select-Object -First 1
          $sig = Get-AuthenticodeSignature -LiteralPath $setup.FullName
          Write-Host "$($setup.Name): $($sig.Status) $($sig.SignerCertificate.Subject)"
          if ($env:DEX_EXPECT_SIGNED -eq '1' -and $sig.Status -ne 'Valid') {
            Write-Error "Signing was configured but the setup signature is $($sig.Status)."; exit 1
          }
          if ($env:DEX_EXPECT_SIGNED -ne '1') {
            Write-Host '::warning::The setup is unsigned (no WINDOWS_CERTIFICATE secret). SmartScreen will warn on first run.'
          }

      - name: Verify Windows bundle
        run: npm run verify:bundle

      - name: Collect release assets
        shell: bash
        run: |
          mkdir -p release-assets
          cp src-tauri/target/release/bundle/nsis/*-setup.exe release-assets/
          cp src-tauri/target/release/bundle/nsis/*-setup.exe.sig release-assets/
          # SHA-256 checksums for this version's installers.
          node scripts/release-checksums.cjs && cp src-tauri/target/release/bundle/SHA256SUMS release-assets/
          echo "Release assets:"
          ls -lh release-assets
          # Fail loudly if the bundle step produced nothing (better than a green
          # run that ships an empty release).
          if [ -z "$(ls -A release-assets)" ]; then
            echo "::error::No installers were produced by the Tauri build."
            exit 1
          fi

      - name: Extract changelog for this version
        shell: bash
        run: |
          TAG="${{ steps.tag.outputs.tag }}"
          VER="${TAG#v}"
          # Pull the section for this version out of docs/CHANGELOG.md. Headings
          # look like: "## v6.1.0 — Title (date)".
          node -e "
            const fs = require('fs');
            const text = fs.readFileSync('docs/CHANGELOG.md', 'utf8');
            const lines = text.split('\n');
            let inside = false, notes = [];
            for (const line of lines) {
              if (!inside && line.startsWith('## v' + process.argv[1])) { inside = true; notes.push(line); continue; }
              if (inside && line.startsWith('## v') && !line.startsWith('## v' + process.argv[1])) break;
              if (inside) notes.push(line);
            }
            fs.writeFileSync('release-notes.md', notes.join('\n').trim() + '\n');
          " "$VER"
          # A dedicated release-notes file, when present, is the release text.
          if [ -f "DEX_${VER}_RELEASE_NOTES.md" ]; then
            cp "DEX_${VER}_RELEASE_NOTES.md" release-notes.md
          fi
          # Fallback so gh always has non-empty notes.
          if [ ! -s release-notes.md ] || [ "$(tr -d '[:space:]' < release-notes.md)" = "" ]; then
            printf '## DEX %s\n\nSee docs/CHANGELOG.md for details.\n' "$TAG" > release-notes.md
          fi
          echo "Generated release notes:"
          cat release-notes.md

      - name: Generate signed update manifest
        env:
          DEX_RELEASE_TAG: ${{ steps.tag.outputs.tag }}
        shell: bash
        run: node scripts/write-update-manifest.mjs "$DEX_RELEASE_TAG" "$GITHUB_REPOSITORY" release-assets

      - name: Publish to GitHub Releases (Dex)
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        shell: bash
        run: |
          TAG="${{ steps.tag.outputs.tag }}"
          REPO="${{ github.repository }}"
          if gh release view "$TAG" --repo "$REPO" >/dev/null 2>&1; then
            echo "::error::This version already has a release. Publish updates under a new version."
            exit 1
          fi
          gh release create "$TAG" --repo "$REPO" --verify-tag --latest --title "DEX OS ${TAG#v}" --notes-file release-notes.md release-assets/*

      - name: Mirror to dex-updates auto-update channel
        if: ${{ env.DEX_UPDATES_TOKEN != '' }}
        env:
          GH_TOKEN: ${{ secrets.DEX_UPDATES_TOKEN }}
        shell: bash
        run: |
          TAG="${{ steps.tag.outputs.tag }}"
          # dex-updates uses the `dex-v*` tag convention (the repo is SHARED with
          # other products under their own prefixes).
          UPDATES_TAG="dex-${TAG}"
          REPO="onazioj179-lab/dex-updates"
          if gh release view "$UPDATES_TAG" --repo "$REPO" >/dev/null 2>&1; then
            gh release upload "$UPDATES_TAG" --repo "$REPO" release-assets/* --clobber
          else
            gh release create "$UPDATES_TAG" --repo "$REPO" --title "DEX OS ${TAG#v}" --notes-file release-notes.md release-assets/*
          fi
          # NOTE: do NOT run scripts/prune-releases.js here. It is COUNT-based and
          # not product-aware; on the shared dex-updates repo it would delete
          # OTHER products' releases (AURUM / SABLE / Magnify). Old DEX tags on
          # this repo are pruned manually with an explicit `dex-v<old>` delete.
