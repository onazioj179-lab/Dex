name: Release

on:
  push:
    tags:
      - 'v*.*.*'
  workflow_dispatch:
    inputs:
      tag:
        description: 'Tag to build (e.g. v4.60.1)'
        required: true

permissions:
  contents: write

jobs:
  build:
    name: Build ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, macos-latest, ubuntu-latest]
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.inputs.tag || github.ref }}

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci --no-audit --no-fund

      - name: Build (Windows)
        if: matrix.os == 'windows-latest'
        run: npm run package:win
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # Code-signing: set CSC_LINK (base64-encoded .pfx) and CSC_KEY_PASSWORD
          # in repo Settings → Secrets → Actions.  When both secrets are present,
          # electron-builder will sign the .exe automatically.  Without them the
          # build still succeeds but Windows Defender will flag the unsigned binary.
          CSC_LINK: ${{ secrets.CSC_LINK }}
          CSC_KEY_PASSWORD: ${{ secrets.CSC_KEY_PASSWORD }}
          CSC_IDENTITY_AUTO_DISCOVERY: 'false'

      - name: Build (macOS)
        if: matrix.os == 'macos-latest'
        run: npm run package:mac
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          CSC_IDENTITY_AUTO_DISCOVERY: 'false'

      - name: Build (Linux)
        if: matrix.os == 'ubuntu-latest'
        run: npm run package:linux
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: dex-${{ matrix.os }}
          path: |
            release/*.exe
            release/*.exe.blockmap
            release/*.dmg
            release/*.zip
            release/*.AppImage
            release/*.deb
            release/*.rpm
            release/latest*.yml
            release/latest-*.yml
          if-no-files-found: warn

  publish:
    name: Publish release
    needs: build
    runs-on: ubuntu-latest
    # Lift the optional dex-updates token to job env so it can be referenced in a
    # step-level `if:` — GitHub does NOT allow the `secrets` context in `if:`
    # conditions (doing so fails the whole workflow at startup with "workflow file
    # issue"). `env` IS allowed in `if:`.
    env:
      DEX_UPDATES_TOKEN: ${{ secrets.DEX_UPDATES_TOKEN }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - uses: actions/download-artifact@v4
        with:
          path: artifacts
      - name: Flatten artifacts
        run: |
          mkdir -p release-assets
          find artifacts -type f -exec cp {} release-assets/ \;
          echo "Release assets:"
          ls -lh release-assets
      - name: Resolve tag
        id: tag
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "tag=${{ github.event.inputs.tag }}" >> "$GITHUB_OUTPUT"
          else
            echo "tag=${GITHUB_REF#refs/tags/}" >> "$GITHUB_OUTPUT"
          fi
      - name: Extract changelog for this version
        id: notes
        run: |
          TAG="${{ steps.tag.outputs.tag }}"
          VER="${TAG#v}"
          # Extract the section for this version from CHANGELOG.md
          node -e "
            const fs = require('fs');
            const text = fs.readFileSync('docs/CHANGELOG.md', 'utf8');
            const lines = text.split('\n');
            let inside = false, notes = [];
            for (const line of lines) {
              if (!inside && line.startsWith('## v' + process.argv[1])) { inside = true; notes.push(line); continue; }
              if (inside && line.startsWith('## v') && !line.startsWith('## v' + process.argv[1])) break;
              if (inside) notes.push(line);
            }
            fs.writeFileSync('release-notes.md', notes.join('\n').trim() + '\n');
          " "$VER"
          echo "Generated release notes:"
          cat release-notes.md
      - name: Publish to GitHub Releases
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          TAG="${{ steps.tag.outputs.tag }}"
          REPO="${{ github.repository }}"
          if gh release view "$TAG" --repo "$REPO" >/dev/null 2>&1; then
            gh release upload "$TAG" --repo "$REPO" release-assets/* --clobber
            gh release edit "$TAG" --repo "$REPO" --notes-file release-notes.md --title "DEX $TAG"
          else
            gh release create "$TAG" --repo "$REPO" --title "DEX $TAG" --notes-file release-notes.md release-assets/*
          fi
      - name: Prune old releases (keep newest 3)
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: node scripts/prune-releases.js --repo "${{ github.repository }}" --keep 3
      - name: Publish to dex-updates auto-update channel
        if: ${{ env.DEX_UPDATES_TOKEN != '' }}
        env:
          GH_TOKEN: ${{ secrets.DEX_UPDATES_TOKEN }}
        run: |
          TAG="${{ steps.tag.outputs.tag }}"
          REPO="onazioj179-lab/dex-updates"
          if gh release view "$TAG" --repo "$REPO" >/dev/null 2>&1; then
            gh release upload "$TAG" --repo "$REPO" release-assets/* --clobber
          else
            gh release create "$TAG" --repo "$REPO" --title "DEX $TAG" --notes-file release-notes.md release-assets/*
          fi
          node scripts/prune-releases.js --repo "$REPO" --keep 3
