# =============================================================================
# DEX - CI Pipeline
# Lint, type-check, unit tests, and renderer build on every push/PR.
# Packaging and publishing live in release.yml (one official setup).
# =============================================================================

# Runners are pinned to ubuntu-24.04: the ubuntu-latest label moved to Ubuntu 26.04,
# where Playwright cannot install Chromium and the E2E job failed before running a test.
# Move the pin forward only after `npx playwright install --with-deps chromium` works there.

name: CI

on:
  push:
    branches: [main, develop]
    tags: ['v*']
  pull_request:
    branches: [main, develop]
  workflow_dispatch:

# Read-only token: CI only checks out and tests. Publishing lives in release.yml.
permissions:
  contents: read

# A newer push to the same branch/PR supersedes the running checks.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  NODE_VERSION: '20.x'

jobs:
  # ---------------------------------------------------------------------------
  # Lint, type-check, watermark verification
  # ---------------------------------------------------------------------------
  lint:
    name: Lint & Type Check
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Setup Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'

      # Skip native postinstall work; CI only needs the JS/TS toolchain to
      # lint and test.
      - name: Install dependencies
        run: npm ci --ignore-scripts

      # The three parts of `npm run lint`, as separate steps so a red run names
      # which one failed.
      - name: Type check
        run: npx tsc --noEmit

      - name: Watermark check
        run: npm run watermark:check

      # "We do not break userspace": a shipped native channel may not vanish,
      # and the renderer may not call a channel nothing answers.
      - name: IPC ABI check
        run: npm run abi:check

      - name: Version consistency
        run: npm run version:check

  # ---------------------------------------------------------------------------
  # Unit tests (Vitest)
  # ---------------------------------------------------------------------------
  test:
    name: Unit Tests
    runs-on: ubuntu-24.04
    needs: lint
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Setup Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'

      - name: Install dependencies
        run: npm ci --ignore-scripts

      - name: Run tests
        run: npm test

  # ---------------------------------------------------------------------------
  # Renderer + main build verification
  # ---------------------------------------------------------------------------
  build:
    name: Build (renderer)
    runs-on: ubuntu-24.04
    needs: lint
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Setup Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'

      - name: Install dependencies
        run: npm ci --ignore-scripts

      - name: Build
        run: npm run build

  # ---------------------------------------------------------------------------
  # Supply chain: known-vulnerable production dependencies, committed secrets,
  # and (on PRs) newly added dependencies with advisories or bad licences.
  # ---------------------------------------------------------------------------
  security:
    name: Dependency & secret scan
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: Audit production dependencies
        run: npm audit --omit=dev --audit-level=high

      - name: Secret scan
        uses: gitleaks/gitleaks-action@ff98106e4c7b2bc287b24eaf42907196329070c7 # v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Dependency review
        if: github.event_name == 'pull_request'
        uses: actions/dependency-review-action@2031cfc080254a8a887f58cffee85186f0e49e48 # v4
        with:
          fail-on-severity: high

  # ---------------------------------------------------------------------------
  # Native core (Rust): the core/ workspace (search, audio DSP, ledger, DTP,
  # vault...) had no CI at all. Windows/MSVC, the platform DEX ships on.
  # ---------------------------------------------------------------------------
  rust-core:
    name: Rust core tests
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@39008827e6b4319a349e9a42dfc90579dd25f1ca # stable

      - name: Cache cargo build
        uses: swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2
        with:
          workspaces: core

      - name: Test
        working-directory: core
        run: cargo test --workspace --locked

  # ---------------------------------------------------------------------------
  # Web smoke run (Playwright): the real renderer in Chromium, served by Vite.
  # Boots the shell and opens every app; fails on an error boundary, a page
  # error, or an app whose styles leak onto other apps.
  # ---------------------------------------------------------------------------
  e2e:
    name: E2E (web renderer)
    runs-on: ubuntu-24.04
    needs: lint
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Setup Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'

      - name: Install dependencies
        run: npm ci --ignore-scripts

      - name: Install Chromium
        run: npx playwright install --with-deps chromium

      - name: Run web smoke tests
        run: npm run test:e2e

      - name: Upload report
        if: failure()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: e2e-report
          path: test-results/
          retention-days: 7

  # Windows preview installers are built locally with npm run build:tauri.
