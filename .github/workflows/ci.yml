# =============================================================================
# DEX - CI Pipeline
# Lint, type-check, unit tests, and renderer build on every push/PR.
# Packaging and publishing live in release.yml (one official setup).
# =============================================================================

name: CI

on:
  push:
    branches: [main, develop]
    tags: ['v*']
  pull_request:
    branches: [main, develop]
  workflow_dispatch:

env:
  NODE_VERSION: '20.x'

jobs:
  # ---------------------------------------------------------------------------
  # Lint, type-check, watermark verification
  # ---------------------------------------------------------------------------
  lint:
    name: Lint & Type Check
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'

      # Skip electron-builder install-app-deps and other native postinstall
      # work; CI only needs the JS/TS toolchain to lint and test.
      - name: Install dependencies
        run: npm ci --ignore-scripts

      - name: Type check & watermark check
        run: npm run lint

  # ---------------------------------------------------------------------------
  # Unit tests (Vitest)
  # ---------------------------------------------------------------------------
  test:
    name: Unit Tests
    runs-on: ubuntu-latest
    needs: lint
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'

      - name: Install dependencies
        run: npm ci --ignore-scripts

      - name: Run tests
        run: npm test

  # ---------------------------------------------------------------------------
  # Renderer + main build verification
  # ---------------------------------------------------------------------------
  build:
    name: Build (renderer + main)
    runs-on: ubuntu-latest
    needs: lint
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'

      - name: Install dependencies
        run: npm ci --ignore-scripts

      - name: Build
        run: npm run build

  # Installers are NOT built here. The one official Windows setup (Tauri NSIS)
  # is built and published by .github/workflows/release.yml on a v* tag.
