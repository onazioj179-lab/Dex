# =============================================================================
# DEX - CI Pipeline
# Lint, type-check, unit tests, and renderer/main build on every push/PR.
# Heavy package/release jobs only run on tags or manual dispatch so the
# default `main` workflow stays green and fast.
# =============================================================================

name: CI

on:
  push:
    branches: [main, develop]
    tags: ['v*']
  pull_request:
    branches: [main, develop]
  workflow_dispatch:

env:
  NODE_VERSION: '20.x'

jobs:
  # ---------------------------------------------------------------------------
  # Lint, type-check, watermark verification
  # ---------------------------------------------------------------------------
  lint:
    name: Lint & Type Check
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'

      # Skip electron-builder install-app-deps and other native postinstall
      # work; CI only needs the JS/TS toolchain to lint and test.
      - name: Install dependencies
        run: npm ci --ignore-scripts

      - name: Type check & watermark check
        run: npm run lint

  # ---------------------------------------------------------------------------
  # Unit tests (Vitest)
  # ---------------------------------------------------------------------------
  test:
    name: Unit Tests
    runs-on: ubuntu-latest
    needs: lint
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'

      - name: Install dependencies
        run: npm ci --ignore-scripts

      - name: Run tests
        run: npm test

  # ---------------------------------------------------------------------------
  # Renderer + main build verification
  # ---------------------------------------------------------------------------
  build:
    name: Build (renderer + main)
    runs-on: ubuntu-latest
    needs: lint
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'

      - name: Install dependencies
        run: npm ci --ignore-scripts

      - name: Build
        run: npm run build

  # ---------------------------------------------------------------------------
  # Native backend verification
  # ---------------------------------------------------------------------------
  native:
    name: Native tests (Windows)
    runs-on: windows-latest
    needs: lint
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
      - run: npm ci --ignore-scripts
      - run: cargo test --locked --manifest-path src-tauri/Cargo.toml

  # Installer artifacts are built by release.yml after its quality gates.
  # Publishing remains a manual action after installed-app and boot acceptance.
