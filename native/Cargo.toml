[package]
name = "dex-native"
version = "3.6.2"
edition = "2021"
description = "DEX native kernel + performance modules"
license = "MIT"

[lib]
crate-type = ["cdylib"]

[dependencies]
napi = { version = "2", features = ["napi9", "async", "serde-json", "tokio_rt"] }
napi-derive = "2"
sysinfo = "0.30"
jwalk = "0.8"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
chrono = { version = "0.4", features = ["serde"] }
dirs = "5"
notify = { version = "6", features = ["serde"] }
once_cell = "1"
image = { version = "0.25", default-features = false, features = ["jpeg", "png", "webp", "gif", "bmp", "tiff", "ico"] }
hound = "3.5"
rayon = "1.10"
ringbuf = "0.4"
aes-gcm = "0.10"
rand = "0.8"
tokio = { version = "1", features = ["rt-multi-thread", "sync", "time", "fs", "io-util", "macros"] }
dashmap = "6"
lru = "0.12"
parking_lot = "0.12"
zstd = "0.13"
memmap2 = "0.9"
symphonia = { version = "0.5", features = ["mp3", "flac", "ogg", "aac", "pcm", "wav"] }
ed25519-dalek = { version = "2", default-features = false, features = ["std"] }
sha2 = "0.10"
hex = "0.4"

[build-dependencies]
napi-build = "2"
cc = "1"

[profile.release]
opt-level = 3
lto = "thin"
strip = "symbols"
codegen-units = 1
