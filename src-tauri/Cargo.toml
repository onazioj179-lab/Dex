[package]
name = "dex-tauri"
description = "DEX OS desktop shell (Tauri) by Onazi oJ"
version = "7.0.1"
edition = "2021"
license = "MIT"
authors = ["Onazi Treasure OJ <onazi75@gmail.com>"]

# Standalone package (NOT a member of core/'s workspace) so `cd core && cargo
# test` stays fast and tauri-free. It depends on the native router by path.

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["unstable", "devtools"] }  # unstable: child webviews for the Browser app (browser_view.rs); devtools: Inspect for Browser pages only (DEX windows set devtools off)
serde = { version = "1", features = ["derive"] }
serde_json = "1"
dex-smart-router = { path = "../core/dex-smart-router" }
dex-vault = { path = "../core/dex-vault" }
dex-search = { path = "../core/dex-search" }
dex-audio = { path = "../core/dex-audio" }
dex-automation = { path = "../core/dex-automation" }
dex-scanner = { path = "../core/dex-scanner" }
dex-rewind = { path = "../core/dex-rewind" }
dex-ai-runtime = { path = "../core/dex-ai-runtime" }
dex-ledger = { path = "../core/dex-ledger" }  # DEX Ledger finance engine (own ledger.db)
# Native backend ports (Electron->Tauri migration):
sysinfo = "0.30"   # system status + process list/kill
open = "5"          # shell: open path / external url with the OS default
arboard = "3"       # clipboard read/write
trash = "5"         # move-to-recycle-bin (safe delete)
rusqlite = { version = "0.31", features = ["bundled"] }  # native dex.db (shared by ~50 subsystems); bundled = no system sqlite needed
flate2 = "1"        # zlib deflate/inflate (Node zlib parity for snapshot/archive BLOBs); pure-Rust miniz_oxide
base64 = "0.22"     # Node Buffer base64 parity (session-replay states, binary-over-bridge standard)
tauri-plugin-dialog = "2"        # native file/folder pickers (dialog:showOpenDialog, files:openDialog) — replaces Electron dialog.showOpenDialog
tauri-plugin-notification = "2"  # OS notification toasts (notification-center:send) — replaces Electron Notification
tauri-plugin-single-instance = "2"  # second launch focuses the running window instead of a duplicate shell (see main())
ureq = { version = "2", features = ["tls"] }  # tiny blocking HTTP client for link-preview metadata fetch
notify = "6"        # live filesystem watching (file-watcher:newFile auto-import/notify) — replaces Electron fs.watch
tiny_http = "0.12"  # LAN file-share HTTP server (http-transfer: QR/link download + upload) — replaces Electron http.createServer
portable-pty = "0.9"  # real pseudoterminal for the Terminal app (ConPTY on Windows, openpty on unix) — terminal.rs

# WebView2 preflight (src/webview2.rs). Same versions wry already pulls in, so
# these add no new crates to the build — they just make the loader API callable.
[target.'cfg(windows)'.dependencies]
webview2-com = "0.38"
windows-core = "0.61"

# Release builds: full optimisation, cross-crate LTO, one codegen unit for the
# best code, and no debug info in the shipped exe. On MSVC symbols never live in
# the exe; `line-tables-only` makes cargo emit a small .pdb next to it for
# crash symbolication, and the bundler does not ship .pdb files. Panics keep
# unwinding (not abort): main.rs wraps IPC handlers in catch_unwind so one bad
# channel can't take the whole shell down.
[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 1
debug = "line-tables-only"
incremental = false

[features]
# Tauri's default release feature for the embedded asset protocol.
custom-protocol = ["tauri/custom-protocol"]
