# ===========================================================================
# DEX OS -- Partition Layout Configuration
# ===========================================================================
# Sourced by install.sh during disk installation.
# Modify these values to change the default partition sizes.
# ===========================================================================

# EFI System Partition (FAT32)
# Stores GRUB EFI bootloader. 512M is more than enough.
EFI_SIZE="512M"

# Swap partition
# 2G is sufficient for 4-8GB RAM systems. Increase for hibernation support.
# For hibernation: set to RAM size + 1G.
SWAP_SIZE="2G"

# Root filesystem (ext4)
# Uses all remaining disk space after EFI and swap.
# Minimum recommended: 8G
# ROOT_SIZE is calculated automatically: (disk - EFI_SIZE - SWAP_SIZE)
