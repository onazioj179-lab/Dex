# ===========================================================================
# DEX OS -- GRUB Bootloader Configuration
# ===========================================================================
# Supports both EFI and legacy BIOS boot.
# Quiet boot with DEX branding. 5-second timeout for recovery menu.
# ===========================================================================

set default=0
set timeout=5
set timeout_style=hidden

# Suppress GRUB messages for clean boot experience
set gfxmode=auto
set gfxpayload=keep

# ---------------------------------------------------------------------------
# DEX OS -- Normal Boot
# ---------------------------------------------------------------------------
menuentry "DEX OS" --class os {
    linux /boot/bzImage root=/dev/sda2 ro quiet loglevel=0 \
        vt.global_cursor_default=0 \
        consoleblank=0 \
        splash \
        systemd.show_status=false \
        rd.systemd.show_status=false \
        udev.log_level=0
    initrd /boot/initramfs.img
}

# ---------------------------------------------------------------------------
# DEX OS -- Recovery Mode (verbose boot, shell access)
# ---------------------------------------------------------------------------
menuentry "DEX OS (Recovery)" --class os {
    linux /boot/bzImage root=/dev/sda2 rw loglevel=7 \
        systemd.unit=rescue.target \
        net.ifnames=0
    initrd /boot/initramfs.img
}

# ---------------------------------------------------------------------------
# DEX OS -- Install to Disk (from live USB)
# ---------------------------------------------------------------------------
menuentry "Install DEX OS" --class os {
    linux /boot/bzImage root=/dev/sda2 ro quiet \
        dex.mode=install \
        systemd.unit=multi-user.target
    initrd /boot/initramfs.img
}
