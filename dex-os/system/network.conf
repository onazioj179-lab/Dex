# ===========================================================================
# DEX OS -- NetworkManager Configuration
# ===========================================================================
# Default networking: DHCP on wired, WiFi scan enabled, DNS via systemd-resolved.
# ===========================================================================

[main]
plugins=keyfile
dns=systemd-resolved
autoconnect-retries-default=3

[keyfile]
unmanaged-devices=none

[connectivity]
enabled=true
interval=300

[connection]
wifi.powersave=2
connection.autoconnect=true

[device]
wifi.scan-rand-mac-address=yes
wifi.backend=wpa_supplicant
