# ===========================================================================
# DEX OS -- Xorg Configuration
# ===========================================================================
# Minimal Xorg with modesetting driver. No window manager -- DEX (Electron)
# handles all window management internally in kiosk mode.
# ===========================================================================

Section "ServerLayout"
    Identifier  "DEX Layout"
    Screen      0 "Screen0" 0 0
    InputDevice "Keyboard0" "CoreKeyboard"
    InputDevice "Mouse0"    "CorePointer"
EndSection

Section "ServerFlags"
    Option "BlankTime"    "0"
    Option "StandbyTime"  "0"
    Option "SuspendTime"  "0"
    Option "OffTime"      "0"
    Option "DontVTSwitch" "false"
    Option "AutoAddDevices"      "true"
    Option "AutoEnableDevices"   "true"
    Option "AllowEmptyInput"     "false"
EndSection

Section "InputDevice"
    Identifier "Keyboard0"
    Driver     "libinput"
    Option     "XkbLayout" "us"
EndSection

Section "InputDevice"
    Identifier "Mouse0"
    Driver     "libinput"
EndSection

Section "Device"
    Identifier "GPU0"
    Driver     "modesetting"
    Option     "AccelMethod" "glamor"
    Option     "DRI"         "3"
EndSection

Section "Monitor"
    Identifier "Monitor0"
    Option     "DPMS" "false"
EndSection

Section "Screen"
    Identifier "Screen0"
    Device     "GPU0"
    Monitor    "Monitor0"
    DefaultDepth 24
    SubSection "Display"
        Depth  24
        Modes  "1920x1080" "1366x768" "1280x720" "1024x768"
    EndSubSection
EndSection

Section "Extensions"
    Option "MIT-SHM"   "Enable"
    Option "DPMS"      "Disable"
    Option "Composite" "Enable"
EndSection
