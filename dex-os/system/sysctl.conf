# ===========================================================================
# DEX OS -- Kernel Sysctl Tuning
# ===========================================================================
# Performance tuning for a single-application desktop OS.
# Installed to: /etc/sysctl.d/99-dex.conf
# ===========================================================================

# -- Virtual Memory -----------------------------------------------------------
# Reduce swappiness -- DEX should stay in RAM as much as possible
vm.swappiness = 10
# Reduce vfs_cache_pressure to keep directory/inode caches longer
vm.vfs_cache_pressure = 50
# Allow dirty pages to accumulate longer before writeback (better batch I/O)
vm.dirty_ratio = 20
vm.dirty_background_ratio = 5
# Larger max_map_count for Chromium / Electron
vm.max_map_count = 262144
# Over-commit memory (Electron can request large virtual address spaces)
vm.overcommit_memory = 1

# -- File System --------------------------------------------------------------
# Increase inotify limits for DEX file watcher
fs.inotify.max_user_watches = 524288
fs.inotify.max_user_instances = 1024
# Increase max open files
fs.file-max = 2097152
# Increase AIO requests for async I/O operations
fs.aio-max-nr = 1048576

# -- Networking ---------------------------------------------------------------
# Faster TCP for file transfers
net.core.rmem_max = 16777216
net.core.wmem_max = 16777216
net.core.rmem_default = 1048576
net.core.wmem_default = 1048576
net.ipv4.tcp_rmem = 4096 1048576 16777216
net.ipv4.tcp_wmem = 4096 1048576 16777216
net.ipv4.tcp_fastopen = 3
net.ipv4.tcp_mtu_probing = 1
# Reuse TIME_WAIT sockets for faster reconnection
net.ipv4.tcp_tw_reuse = 1

# -- Kernel -------------------------------------------------------------------
# Increase PID max for thread pool workers
kernel.pid_max = 65536
# Reduce printk verbosity for clean boot
kernel.printk = 3 3 3 3
# SysRq for emergency recovery (Alt+SysRq+REISUB)
kernel.sysrq = 1
# Increase shared memory for Chromium
kernel.shmmax = 2147483648
kernel.shmall = 2097152
