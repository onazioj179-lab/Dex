# ===========================================================================
# DEX OS -- PulseAudio Configuration
# ===========================================================================
# Auto-detect audio hardware. Load ALSA sink/source modules automatically.
# ===========================================================================

# Automatically load driver modules
.ifexists module-udev-detect.so
load-module module-udev-detect
.else
load-module module-detect
.endif

# Load ALSA sink and source
load-module module-alsa-sink
load-module module-alsa-source device=hw:0,0

# Accept clients via native protocol
load-module module-native-protocol-unix

# Auto-restore volume levels
load-module module-stream-restore
load-module module-card-restore
load-module module-device-restore

# Default sample rate for low-latency audio
load-module module-suspend-on-idle timeout=5

# Cork music streams when a notification plays
load-module module-role-cork

# Set default sink volume to 70%
set-sink-volume @DEFAULT_SINK@ 45000
set-sink-mute @DEFAULT_SINK@ 0
