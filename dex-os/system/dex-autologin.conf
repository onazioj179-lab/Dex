# ===========================================================================
# DEX OS -- Getty Auto-Login Override
# ===========================================================================
# Placed at: /etc/systemd/system/getty@tty1.service.d/override.conf
# Auto-logs in the 'dex' user on tty1 with no password prompt.
# ===========================================================================

[Service]
ExecStart=
ExecStart=-/sbin/agetty --autologin dex --noclear %I $TERM
Type=idle
