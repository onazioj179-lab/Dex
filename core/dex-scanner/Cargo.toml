[package]
name = "dex-scanner"
description = "DEX 6.0 native file scanner — duplicate detection via content hashing (GOAL-6A)"
version.workspace = true
edition.workspace = true
license.workspace = true
authors.workspace = true

[dependencies]
serde = { version = "1", features = ["derive"] }
sha2 = "0.10"
rayon = "1"   # parallel SHA-256 hashing of same-size duplicate candidates

[dev-dependencies]
tempfile = "3"
