[package]
name = "dex-audio"
description = "DEX 6.0 native audio analysis — metadata + waveform extraction (GOAL-6C)"
version.workspace = true
edition.workspace = true
license.workspace = true
authors.workspace = true

[dependencies]
serde = { version = "1", features = ["derive"] }
symphonia = { version = "0.5", features = ["mp3", "flac", "ogg", "aac", "pcm", "wav", "aiff", "isomp4"] }

[dev-dependencies]
tempfile = "3"
