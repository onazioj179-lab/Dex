[package]
name = "dex-vault"
description = "DEX 6.0 native Vault — encrypted password manager + TOTP authenticator (GOAL-6B)"
version.workspace = true
edition.workspace = true
license.workspace = true
authors.workspace = true

[dependencies]
aes-gcm = "0.10"   # AES-256-GCM authenticated encryption
argon2 = "0.5"     # Argon2id password-based key derivation
hmac = "0.12"      # HMAC for TOTP
sha1 = "0.10"      # SHA-1 for RFC-6238 TOTP
rand = "0.8"       # CSPRNG for salts/nonces/password generation
base64 = "0.22"    # envelope encoding
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[dev-dependencies]
tempfile = "3"
