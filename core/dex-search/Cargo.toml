[package]
name = "dex-search"
description = "DEX 6.0 native search index (Tantivy-backed full-text file index) — GOAL-6A"
version.workspace = true
edition.workspace = true
license.workspace = true
authors.workspace = true

[dependencies]
tantivy = "0.22"
serde = { version = "1", features = ["derive"] }
rayon = "1"   # parallel per-file content reads during index_path
dex-cache = { path = "../dex-cache" }   # query-result cache (invalidated on writes)

[dev-dependencies]
tempfile = "3"
