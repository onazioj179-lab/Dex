<!DOCTYPE html>
<html lang="en" data-theme="dark">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <!-- Phase 50: Security Hardening - Content Security Policy (Strict Mode) -->
    <meta http-equiv="Content-Security-Policy" content="
      default-src 'self';
      script-src 'self' 'unsafe-inline';
      style-src 'self' 'unsafe-inline';
      img-src 'self' data: blob: file:;
      font-src 'self' data:;
      connect-src 'self' ws://localhost:* http://localhost:* https://api.openai.com https://api.anthropic.com https://generativelanguage.googleapis.com;
      media-src 'self' blob: file:;
      frame-src https: http:;
      child-src https: http:;
      object-src 'none';
      base-uri 'self';
      form-action 'self';
      frame-ancestors 'none';
    " />
    <meta http-equiv="X-Content-Type-Options" content="nosniff" />
    <meta http-equiv="X-Frame-Options" content="DENY" />
    <meta http-equiv="X-XSS-Protection" content="1; mode=block" />
    <!-- camera/microphone allowed for self so UKI voice search and webview media work; payment/usb/magnetometer/etc. remain disabled. -->
    <meta http-equiv="Permissions-Policy" content="camera=(self), microphone=(self), geolocation=(self), payment=(), usb=(), magnetometer=(), gyroscope=(), accelerometer=(), display-capture=(self), fullscreen=(self)" />
    <meta name="referrer" content="strict-origin-when-cross-origin" />
    <title>Dex - Control Hub</title>
    <style>
      /* DEX Design Tokens (inlined to prevent FOUC) */
      :root {
        --color-bg-base: #0a0a14;
        --color-bg-surface: #0A0A0A;
        --color-bg-elevated: #111111;
        --color-bg-secondary: #0D0D0D;
        --color-bg-hover: rgba(255,255,255,0.04);
        --color-bg-glass: rgba(10,10,10,0.85);
        --color-text-primary: #F2F2F2;
        --color-text-secondary: #A0A0A0;
        --color-text-muted: #5A5A5A;
        --color-text-tertiary: #404040;
        --color-accent: #4A9EFF;
        --color-accent-text: #FFFFFF;
        --color-accent-hover: #68B2FF;
        --color-accent-subtle: rgba(74,158,255,0.12);
        --color-border: rgba(255,255,255,0.08);
        --color-border-subtle: rgba(255,255,255,0.04);
        --color-success: #30D158;
        --color-warning: #FFD60A;
        --color-danger: #FF453A;
        --color-shadow-soft: rgba(0,0,0,0.3);
        --color-shadow-strong: rgba(0,0,0,0.5);
        --font-family: -apple-system, BlinkMacSystemFont, 'SF Pro Text', 'Segoe UI', system-ui, sans-serif;
        --font-mono: 'SF Mono', 'Cascadia Code', 'JetBrains Mono', monospace;
        --space-unit: 4px;
        --radius-sm: 6px;
        --radius-md: 10px;
        --radius-lg: 16px;
        --radius-xl: 24px;
      }
      /* Critical fallback styles - ensures app is visible even if CSS fails */
      html, body, #root {
        margin: 0;
        padding: 0;
        width: 100%;
        height: 100vh;
        overflow: hidden;
        font-family: var(--font-family);
        color: #F2F2F2;
      }
      html { background: #0C0C0E; }
      body, #root { background: transparent; }
      /* Light mode */
      html[data-theme="light"] {
        background: #f5f5f7 !important;
        color: #1d1d1f !important;
      }
      html[data-theme="light"] body, html[data-theme="light"] #root {
        background: transparent !important;
        color: #1d1d1f !important;
      }
      /* Dark mode (default) */
      html[data-theme="dark"] {
        background: #0C0C0E !important;
        color: #fafafa !important;
      }
      html[data-theme="dark"] body, html[data-theme="dark"] #root,
      html:not([data-theme]) body, html:not([data-theme]) #root {
        background: transparent !important;
        color: #fafafa !important;
      }
      #root:empty::before {
        content: '';
        display: block;
      }
    </style>
    <script>
      // Apply theme immediately to prevent flash
      (function() {
        var savedDarkMode = localStorage.getItem('darkMode');
        var isDark = savedDarkMode === null ? true : savedDarkMode === 'true';
        document.documentElement.setAttribute('data-theme', isDark ? 'dark' : 'light');
        if (document.body && isDark) document.body.classList.add('dark-mode');
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="./main.tsx"></script>
  </body>
</html>
