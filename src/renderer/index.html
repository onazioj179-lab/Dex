<!DOCTYPE html>
<html lang="en" data-theme="dark">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <!-- Phase 50: Security Hardening - Content Security Policy (Strict Mode) -->
    <!-- 'unsafe-eval' is required by the DEX Code / DexScript runtime, which runs
         the user's own transpiled script via new Function() (see
         DEXAPPLICATIONS/standalone/dexCode/runtime.ts). Without it DexCode cannot
         run ANY code. The runtime sandboxes the code by nulling window/fetch/eval/
         Function/storage. SECURITY NOTE: this widens the renderer's XSS surface;
         the harder-but-stricter alternative is executing DexScript in a
         main-process Node vm sandbox over IPC (keeps the renderer eval-free). -->
    <!-- connect-src deliberately does NOT allow Tauri's custom-protocol IPC
         (`ipc:` / http://ipc.localhost). Tauri's first invoke() is refused, it
         logs "IPC custom protocol failed" ONCE and falls back to postMessage.
         Measured in the packaged app (same page, A/B, 2026-11): postMessage is
         ~5x faster on WebView2 — 0.3 ms vs 1.7 ms p50 per call, 1.7 vs 3.6 ms
         for a 100 KB payload. Allowing the protocol would slow every IPC call.
         Every host below is one the code actually fetches, and nothing else:
         worldtimeapi / dictionaryapi / er-api = UKI's keyless answers (were
         CSP-blocked, so those answers silently returned nothing); arcgisonline /
         opentopomap = the Maps app's Satellite and Topo styles (rendered blank).
         dexmedia.localhost = the user's local photos/music/video/PDFs served by
         src-tauri media_protocol.rs (file:// is refused from this origin). -->
    <meta http-equiv="Content-Security-Policy" content="
      default-src 'self';
      script-src 'self' 'unsafe-inline' 'unsafe-eval';
      style-src 'self' 'unsafe-inline';
      img-src 'self' data: blob: file: http://dexmedia.localhost https://tiles.openfreemap.org https://server.arcgisonline.com https://*.tile.opentopomap.org;
      font-src 'self' data:;
      connect-src 'self' ws://localhost:* http://localhost:* http://dexmedia.localhost https://api.openai.com https://api.anthropic.com https://generativelanguage.googleapis.com https://openrouter.ai https://api.groq.com https://api.mistral.ai https://api.deepseek.com https://api.x.ai https://tiles.openfreemap.org https://api.open-meteo.com https://geocoding-api.open-meteo.com https://photon.komoot.io https://routing.openstreetmap.de https://api.duckduckgo.com https://en.wikipedia.org https://worldtimeapi.org https://api.dictionaryapi.dev https://open.er-api.com https://server.arcgisonline.com https://*.tile.opentopomap.org;
      media-src 'self' blob: file: http://dexmedia.localhost;
      frame-src https: http:;
      child-src https: http:;
      worker-src 'self' blob:;
      object-src 'none';
      base-uri 'self';
      form-action 'self';
    " />
    <!-- NOTE: frame-ancestors (CSP) and X-Frame-Options are intentionally NOT set
         here: browsers ignore both when delivered via <meta> (only valid as HTTP
         headers), so they were dead no-ops that logged console errors on every
         launch. A packaged file:// desktop app is not web-embeddable, so framing/
         clickjacking protection is moot; if ever needed, set them as real HTTP
         headers via session.webRequest.onHeadersReceived in the main process. -->
    <meta http-equiv="X-Content-Type-Options" content="nosniff" />
    <meta http-equiv="X-XSS-Protection" content="1; mode=block" />
    <!-- camera/microphone allowed for self so UKI voice search and webview media work; payment/usb/magnetometer/etc. remain disabled. -->
    <meta http-equiv="Permissions-Policy" content="camera=(self), microphone=(self), geolocation=(self), payment=(), usb=(), magnetometer=(), gyroscope=(), accelerometer=(), display-capture=(self), fullscreen=(self)" />
    <meta name="referrer" content="strict-origin-when-cross-origin" />
    <title>DEX OS</title>
    <style>
      /* DEX Design Tokens (inlined to prevent FOUC).
         Boot-time fallbacks — every value here MUST equal the runtime
         definition in design-system.css / design-tokens.css, or the app
         flashes the wrong look on every launch (--color-danger mirrors the
         dark-theme --color-error). Only --space-unit is boot-only. */
      :root {
        --color-bg-base: #111215;
        --color-bg-surface: #1C1C1E;
        --color-bg-elevated: #2C2C2E;
        --color-bg-secondary: #18181A;
        --color-bg-hover: #2A2A2D;
        --color-bg-glass: #1C1C1E;
        --color-text-primary: #F5F5F7;
        --color-text-secondary: #BBC0C9;
        --color-text-muted: #A0A0A5;
        --color-text-tertiary: #8E8E93;
        --color-accent: #0A84FF;
        --color-accent-text: #FFFFFF;
        --color-accent-hover: #409CFF;
        --color-accent-fill: #0071E3;
        --color-accent-subtle: rgba(10, 132, 255, 0.12);
        --color-border: rgba(255, 255, 255, 0.16);
        --color-border-subtle: rgba(255, 255, 255, 0.08);
        --color-success: #34C759;
        --color-warning: #FF9F0A;
        --color-danger: #FF453A;
        --color-shadow-soft: rgba(0, 0, 0, 0.18);
        --color-shadow-strong: rgba(0, 0, 0, 0.30);
        --font-family: 'Berkeley Mono', 'JetBrains Mono', 'SF Mono', 'Fira Code', 'Cascadia Code', 'Menlo', 'Monaco', 'Consolas', monospace;
        --dex-font-ui: -apple-system, "Segoe UI Variable", "Segoe UI", system-ui, Inter, sans-serif;
        --font-mono: 'Berkeley Mono', 'JetBrains Mono', 'SF Mono', 'Fira Code', 'Cascadia Code', 'Menlo', 'Monaco', 'Consolas', monospace;
        --space-unit: 4px;
        --radius-sm: 3px;
        --radius-md: 4px;
        --radius-lg: 6px;
        --radius-xl: 8px;
      }
      /* Critical fallback styles - ensures app is visible even if CSS fails.
         Body chrome uses the native UI stack (--dex-font-ui), matching the
         runtime rule in design-tokens.css. */
      html, body, #root {
        margin: 0;
        padding: 0;
        width: 100%;
        height: 100vh;
        overflow: hidden;
        font-family: var(--dex-font-ui);
        color: #FFFFFF;
      }
      html { background: #111215; }
      body, #root { background: transparent; }
      /* Light mode */
      html[data-theme="light"] {
        background: #f5f5f7 !important;
        color: #1d1d1f !important;
      }
      html[data-theme="light"] body, html[data-theme="light"] #root {
        background: transparent !important;
        color: #1d1d1f !important;
      }
      /* Dark mode (default) */
      html[data-theme="dark"] {
        background: #111215 !important;
        color: #FFFFFF !important;
      }
      html[data-theme="dark"] body, html[data-theme="dark"] #root,
      html:not([data-theme]) body, html:not([data-theme]) #root {
        background: transparent !important;
        color: #FFFFFF !important;
      }
      /* Boot splash: the DEX wordmark and a thin pill progress bar on the
         empty #root. Pure CSS (nothing to remove: React replacing #root's
         content ends it), and it only fades in when boot takes over 250 ms,
         so a fast start never flashes it. */
      #root:empty {
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        gap: 18px;
      }
      #root:empty::before {
        content: 'DEX';
        display: block;
        font: 700 34px/1 var(--dex-font-ui);
        letter-spacing: 0.22em;
        margin-right: -0.22em;
        color: #F5F5F7;
        opacity: 0;
        animation: dexBootIn 0.4s ease 0.25s forwards;
      }
      #root:empty::after {
        content: '';
        display: block;
        width: 132px;
        height: 3px;
        border-radius: 9999px;
        background:
          linear-gradient(90deg, transparent 0%, #0A84FF 50%, transparent 100%) 0 0 / 40% 100% no-repeat,
          rgba(255, 255, 255, 0.12);
        opacity: 0;
        animation: dexBootIn 0.4s ease 0.25s forwards, dexBootBar 1.15s cubic-bezier(0.45, 0, 0.25, 1) 0.25s infinite;
      }
      html[data-theme="light"] #root:empty::before { color: #1d1d1f; }
      html[data-theme="light"] #root:empty::after {
        background:
          linear-gradient(90deg, transparent 0%, #0066CC 50%, transparent 100%) 0 0 / 40% 100% no-repeat,
          rgba(0, 0, 0, 0.10);
      }
      @keyframes dexBootIn { to { opacity: 1; } }
      @keyframes dexBootBar { from { background-position: -60% 0, 0 0; } to { background-position: 160% 0, 0 0; } }
      @media (prefers-reduced-motion: reduce) {
        #root:empty::before, #root:empty::after { animation: dexBootIn 0.01s linear 0.25s forwards; }
      }
    </style>
    <script>
      // Apply theme before first paint. Mirrors resolveThemePreference() in
      // utils/theme.ts (the one controller): 'system' follows the OS, a stored
      // darkMode is an explicit choice, nothing stored means dark.
      (function() {
        var isDark = true;
        try {
          if (localStorage.getItem('dex-theme-source') === 'system') {
            isDark = !window.matchMedia || window.matchMedia('(prefers-color-scheme: dark)').matches;
          } else {
            isDark = localStorage.getItem('darkMode') !== 'false';
          }
        } catch (e) { /* storage unavailable: dark */ }
        var root = document.documentElement;
        root.setAttribute('data-theme', isDark ? 'dark' : 'light');
        root.classList.add(isDark ? 'dark-mode' : 'light-mode');
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="./main.tsx"></script>
  </body>
</html>
