[package]
name = "dex-core"
version = "1.0.0"
edition = "2021"
description = "DEX native performance core -- physics engine, platform APIs, visual effects, game engine"
license = "MIT"

[lib]
crate-type = ["cdylib"]

[dependencies]
# NAPI-RS Node-API bindings
napi = { version = "2", features = ["napi9", "async", "serde-json"] }
napi-derive = "2"

# Async runtime
tokio = { version = "1", features = ["full"] }

# Parallel computation
rayon = "1.8"

# Fast mutexes (no poisoning, smaller footprint)
parking_lot = "0.12"

# Lock-free data structures
crossbeam = "0.8"

# Fast cryptographic hashing (BLAKE3)
blake3 = "1"

# Fast LZ4 compression (pure Rust)
lz4_flex = "0.11"

# Serialization
serde = { version = "1", features = ["derive"] }
serde_json = "1"

# --- Phase 1: Global memory allocator ---
mimalloc = { version = "0.1", default-features = false }

# --- Phase 2: Direct Rust SQLite bindings ---
rusqlite = { version = "0.31", features = ["bundled", "backup"] }

# --- Phase 3: Zstandard compression ---
zstd = "0.13"

# --- Phase 4: Audited cryptography (AES-256-GCM, PBKDF2) ---
ring = "0.17"

# --- Phase 5: Full-text search engine ---
tantivy = "0.22"

# --- Phase 9: Shared-memory process supervisor ---
shared_memory = "0.12"

# Random for crypto and effects
rand = "0.8"

[target.'cfg(target_os = "windows")'.dependencies]
windows = { version = "0.52", features = [
    "Win32_Foundation",
    "Win32_System_Memory",
    "Win32_System_Threading",
    "Win32_Storage_FileSystem",
    "Win32_System_IO",
    "Win32_NetworkManagement_IpHelper",
    "Win32_System_Performance",
    "Win32_System_SystemInformation",
    "Win32_System_ProcessStatus",
    "Win32_Media",
] }

[target.'cfg(target_os = "macos")'.dependencies]
core-foundation = "0.9"
core-graphics = "0.23"
mach2 = "0.4"
libc = "0.2"

[target.'cfg(target_os = "linux")'.dependencies]
nix = { version = "0.27", features = ["fs", "process", "signal", "sched", "mman"] }
libc = "0.2"
io-uring = "0.7"

[build-dependencies]
napi-build = "2"

[profile.release]
opt-level = 3
lto = "fat"
strip = "symbols"
codegen-units = 1
panic = "abort"
